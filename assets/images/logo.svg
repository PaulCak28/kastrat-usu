<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF199" />
      <stop offset="50%" stop-color="#E2B743" />
      <stop offset="100%" stop-color="#C29418" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5C32" />
      <stop offset="100%" stop-color="#06381D" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E53E3E" />
      <stop offset="50%" stop-color="#ED8936" />
      <stop offset="100%" stop-color="#ECC94B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest / Emblem (Left) -->
  <g transform="translate(10, 5)">
    <!-- Outer Gold Ring -->
    <circle cx="45" cy="45" r="43" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.9" />
    <!-- Outer Dashed Orbit -->
    <circle cx="45" cy="45" r="39.5" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.6" />
    
    <!-- Main Green Shield Background -->
    <circle cx="45" cy="45" r="36" fill="url(#greenGrad)" />
    
    <!-- Subtle Laurel Wreath Left -->
    <path d="M 23 58 C 20 48, 23 37, 30 28 C 30 33, 26 40, 27 50 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M 19 46 C 18 40, 20 34, 25 28 C 24 33, 21 38, 22 45 Z" fill="url(#goldGrad)" opacity="0.6" />
    
    <!-- Subtle Laurel Wreath Right -->
    <path d="M 67 58 C 70 48, 67 37, 60 28 C 60 33, 64 40, 63 50 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M 71 46 C 72 40, 70 34, 65 28 C 66 33, 69 38, 68 45 Z" fill="url(#goldGrad)" opacity="0.6" />

    <!-- Open Book Base (Symbol of Kajian & Intellectualism) -->
    <path d="M 33 58 Q 45 61 45 56 Q 45 61 57 58 L 56 53 Q 45 56 45 51 Q 45 56 34 53 Z" fill="#F5F1CA" />
    <path d="M 31 60 Q 45 63 45 58 Q 45 63 59 60 L 58 56 Q 45 59 45 54 Q 45 59 32 56 Z" fill="url(#goldGrad)" opacity="0.8" />
    
    <!-- Torch Handle -->
    <path d="M 43 51 L 47 51 L 46 39 L 44 39 Z" fill="url(#goldGrad)" />
    <!-- Torch Bowl -->
    <path d="M 40 39 Q 45 42 50 39 L 49 37 L 41 37 Z" fill="url(#goldGrad)" />

    <!-- Intellectual Movement Flame -->
    <path d="M 45 23 C 48 27, 51 29, 49 33 C 47 36, 44 37, 45 37 C 42 36, 40 34, 42 30 C 43 27, 44 25, 45 23 Z" fill="url(#flameGrad)" filter="url(#glow)" />
    
    <!-- Top 5-Pointed Star (USU Bintang Bhuana) -->
    <polygon points="45,11 47,16 52,16 48,19 50,24 45,21 40,24 42,19 38,16 43,16" fill="url(#goldGrad)" />

    <!-- Bottom Ribbon text base -->
    <path d="M 27 67 Q 45 74 63 67 L 65 71 Q 45 78 25 71 Z" fill="url(#goldGrad)" />
    <text x="45" y="73" font-family="'Poppins', sans-serif" font-size="5.5" font-weight="800" fill="#06381D" text-anchor="middle" letter-spacing="1">USU</text>
  </g>

  <!-- Typography Lockup (Right) -->
  <g transform="translate(108, 0)">
    <!-- Kicker / Category -->
    <text x="0" y="30" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="700" fill="#F2EB87" letter-spacing="2.8">KAJIAN &amp; AKSI STRATEGIS</text>
    
    <!-- Brand Name -->
    <text x="0" y="62" font-family="'Ibarra Real Nova', Georgia, serif" font-size="33" font-weight="700" fill="#F5F1CA" letter-spacing="1.5">KASTRAT USU</text>
    
    <!-- Subtitle / Affiliation -->
    <text x="0" y="80" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="500" fill="#91A76A" letter-spacing="2.2">PEMA UNIVERSITAS SUMATERA UTARA</text>
  </g>
</svg>

